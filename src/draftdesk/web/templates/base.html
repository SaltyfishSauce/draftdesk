<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block page_title %}{{ title }}{% endblock %}</title>
<style>
  :root {
    --bg: #f5f6f4; --surface: #ffffff; --ink: #1c2420; --muted: #5d6963; --line: #dde2de;
    --brand: #1f6f54; --brand-ink: #ffffff; --brand-soft: #e3f1ea;
    --warn: #8a5a00; --warn-soft: #fff3d6; --danger: #a12a2a; --danger-soft: #fbe6e4;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  .top .wrap { display: flex; align-items: center; gap: 16px; min-height: 60px; flex-wrap: wrap; }
  .logo { font-weight: 700; font-size: 18px; color: var(--ink); }
  .logo span { color: var(--brand); }
  .store { color: var(--muted); }
  .stack { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--bg);
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  main { padding: 24px 0 60px; }
  nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 18px; }
  nav.tabs a { padding: 7px 14px; border-radius: 999px; color: var(--muted); font-weight: 500; }
  nav.tabs a.on { background: var(--ink); color: #fff; }
  nav.tabs a:hover { text-decoration: none; background: var(--line); }
  nav.tabs a.on:hover { background: var(--ink); }
  nav.tabs .n { font-size: 12px; opacity: .75; margin-left: 4px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 14px; }
  .row { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .who { font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .subject { font-size: 16px; font-weight: 600; margin: 6px 0 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-weight: 500; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.danger { background: var(--danger-soft); color: var(--danger); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  .quote { background: var(--bg); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap;
    overflow-wrap: anywhere; font-size: 14px; max-height: 240px; overflow: auto; }
  .quote.tall { max-height: none; }
  .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  button, .btn { font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-block; }
  button.primary, .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  button.danger { color: var(--danger); }
  button:hover, .btn:hover { filter: brightness(.96); text-decoration: none; }
  form.inline { display: inline; }
  textarea, input[type=text] { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink); }
  textarea { min-height: 300px; resize: vertical; line-height: 1.55; }
  .banner { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; background: var(--brand-soft); color: var(--brand); font-weight: 500; }
  .banner.err { background: var(--danger-soft); color: var(--danger); }
  .note { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 14px; margin: 10px 0; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 50px 20px; }
  table.kv { border-collapse: collapse; width: 100%; font-size: 14px; }
  table.kv td { padding: 4px 0; vertical-align: top; }
  table.kv td:first-child { color: var(--muted); width: 110px; }
  ul.plain { list-style: none; padding: 0; margin: 0; font-size: 14px; }
  ul.plain li { padding: 5px 0; border-bottom: 1px solid var(--line); }
  ul.plain li:last-child { border-bottom: 0; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/">Draft<span>Desk</span></a>
    <span class="store">{{ store_name }}</span>
    <div class="stack" title="Connected adapters">
      <span class="pill">mail: {{ providers.email }}</span>
      <span class="pill">store: {{ providers.commerce }}</span>
      <span class="pill">model: {{ providers.llm }}</span>
    </div>
  </div>
</header>
<main>
  <div class="wrap">
    {% if msg %}<div class="banner" role="status">{{ msg }}</div>{% endif %}
    {% if err %}<div class="banner err" role="alert">{{ err }}</div>{% endif %}
    {% block content %}{% endblock %}
  </div>
</main>
</body>
</html>
